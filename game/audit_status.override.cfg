## AUDIT SCRATCH CONFIG (build/ only). Godot loads `game/<name>.override.cfg`
## and merges it, so project.godot is never touched. It runs `game/` as the
## project root with the audit probe mounted as an autoload, and with nothing
## else that could create files inside game/.
[application]
config/name="Chaos World"
run/main_scene="res://build/audit_probe.gd"
config/features=PackedStringArray("4.7", "GL Compatibility")

[autoload]
AuditProbe="*res://build/audit_probe.gd"

[rendering]
renderer/rendering_method="gl_compatibility"
renderer/rendering_method.mobile="gl_compatibility"