[project]
name = "chaos-world-tools"
version = "0.0.0"
description = "Python-only tooling for the Chaos World Godot project."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "gdtoolkit>=4.2",
  "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
